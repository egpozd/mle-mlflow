target_col: price
drop_cols:
  - id
  - building_id
  - studio

test_size: 0.2
random_state: 42

cat_features:
  - building_type_int

model:
  iterations: 300
  depth: 8
  learning_rate: 0.05
  loss_function: RMSE
  random_seed: 42
  verbose: false
  allow_writing_files: false

metrics:
  - rmse
  - mae
  - r2
